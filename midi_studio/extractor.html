<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>FORTISSIMO PRO — Auto-Analyzer</title>
<style>
:root{--bg:#0f0f0f;--fg:#e8e8e8;--b:#2a2a2a;--a:#4ecdc4;--g:#44af69;--w:#f4d35e;--r:#ef476f;}
*{box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--fg);margin:0;padding:20px;max-width:1000px;margin:0 auto}
.section{border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:12px}
.btn{background:var(--fg);color:var(--bg);border:none;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.3}.btn2{background:transparent;color:var(--fg);border:1px solid var(--b)}
.dropzone{border:2px dashed var(--b);border-radius:12px;padding:40px;text-align:center;cursor:pointer}
.dropzone:hover{border-color:var(--fg);background:#1a1a1a}
.progress{height:6px;background:var(--b);border-radius:3px;overflow:hidden}
.progress>div{height:100%;background:var(--fg);width:0%;transition:.4s}
.log{font-size:11px;font-family:monospace;padding:3px 6px;border-radius:4px;margin-bottom:2px}
.tab{display:flex;gap:4px;border-bottom:1px solid var(--b);margin-bottom:12px;overflow-x:auto}
.tab>button{background:transparent;border:none;padding:8px 12px;color:#888;cursor:pointer;border-bottom:2px solid transparent}
.tab>button.active{color:var(--fg);border-bottom-color:var(--fg);font-weight:500}
.panel{display:none}.panel.active{display:block}
.metric{text-align:center;padding:12px;border:1px solid var(--b);border-radius:8px}
.metric>div:first-child{font-size:28px;font-weight:600}
.metric>div:last-child{font-size:11px;color:#888;margin-top:4px}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--b);border-radius:8px;margin-bottom:6px}
.row a{color:var(--fg);text-decoration:none;font-size:13px;font-weight:500}
.piano{position:relative;height:200px;border:1px solid var(--b);border-radius:6px;overflow:hidden;background:#0a0a0a}
.note{position:absolute;border-radius:2px;opacity:.9}
.energy{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.energy>div:nth-child(2){width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.energy>div:nth-child(3){flex:1;height:6px;background:var(--b);border-radius:3px;overflow:hidden}
.energy>div:nth-child(3)>div{height:100%;border-radius:3px;transition:.5s}
.energy>div:nth-child(4){width:40px;text-align:right;color:#888}
.inst{border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:8px}
.inst>div:first-child{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dot{width:10px;height:10px;border-radius:50%}
canvas{border-radius:6px}
</style>
</head>
<body>
<h2>🎛️ FORTISSIMO PRO — Auto-Analyzer</h2>
<p style="font-size:13px;color:#888;margin-bottom:16px">Rilevamento automatico K strumenti • Separazione Wiener soft-mask • YIN pitch tracking • Piano roll</p>

<div class="section">
<div class="dropzone" onclick="document.getElementById('f').click()" ondragover="event.preventDefault();this.style.borderColor='var(--fg)'" ondragleave="this.style.borderColor='var(--b)'" ondrop="hd(event)">
<div style="font-size:32px;margin-bottom:8px">📁</div>
<div style="font-size:15px;font-weight:500">Clicca o trascina un file audio</div>
<div style="font-size:12px;color:#888;margin-top:4px">WAV, MP3, FLAC, OGG</div>
</div>
<input type="file" id="f" accept="audio/*" style="display:none" onchange="hf(event.target.files[0])">
<div id="fi" style="margin-top:10px;font-size:13px;color:#888;display:none"></div>
<div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
<div><label style="font-size:11px;color:#888">Max sorgenti: <span id="vm">6</span></label><input type="range" id="mk" min="2" max="10" value="6" style="width:100%" oninput="document.getElementById('vm').textContent=this.value"></div>
<div><label style="font-size:11px;color:#888">Onset σ: <span id="vo">1.5</span></label><input type="range" id="os" min="10" max="40" value="15" style="width:100%" oninput="document.getElementById('vo').textContent=(this.value/10).toFixed(1)"></div>
<div><label style="font-size:11px;color:#888">Min nota: <span id="vd">50</span>ms</label><input type="range" id="md" min="20" max="200" value="50" style="width:100%" oninput="document.getElementById('vd').textContent=this.value"></div>
</div>
<div style="display:flex;gap:10px;margin-top:14px">
<button class="btn" id="ba" onclick="run()" disabled>🔍 Analizza</button>
<button class="btn btn2" id="bp" onclick="play('o')" disabled>🔊 Play</button>
</div>
</div>

<div class="section" id="pg" style="display:none">
<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span id="pn">...</span><span id="pp">0%</span></div>
<div class="progress"><div id="pf"></div></div>
<div id="lg" style="margin-top:8px;max-height:180px;overflow-y:auto;border:1px solid var(--b);border-radius:6px;padding:6px"></div>
</div>

<div class="section" id="rs" style="display:none">
<div class="tab">
<button class="active" onclick="sw(0)">Panoramica</button>
<button onclick="sw(1)">Strumenti</button>
<button onclick="sw(2)">Spettro</button>
<button onclick="sw(3)">Piano Roll</button>
<button onclick="sw(4)">MIDI</button>
<button onclick="sw(5)">Campioni</button>
<button onclick="sw(6)">Ricostruzione</button>
</div>

<div class="panel active" id="p0">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">
<div class="metric"><div id="m0" style="color:var(--a)">0</div><div>Sorgenti</div></div>
<div class="metric"><div id="m1" style="color:var(--g)">0</div><div>Note</div></div>
<div class="metric"><div id="m2" style="color:var(--w)">—</div><div>SI-SDR dB</div></div>
<div class="metric"><div id="m3" style="color:var(--r)">—</div><div>Tempo sec</div></div>
</div>
<div id="ec"></div>
<div id="ov" style="margin-top:12px"></div>
</div>

<div class="panel" id="p1"><div id="il"></div></div>
<div class="panel" id="p2">
<div style="font-size:12px;color:#888;margin-bottom:6px">Originale</div><canvas id="so" width="860" height="200" style="border:1px solid var(--b)"></canvas>
<div style="font-size:12px;color:#888;margin:10px 0 6px">Ricostruito</div><canvas id="sr" width="860" height="200" style="border:1px solid var(--b)"></canvas>
</div>
<div class="panel" id="p3"><div id="pr"></div></div>
<div class="panel" id="p4"><div id="md"></div></div>
<div class="panel" id="p5"><div id="sd"></div></div>
<div class="panel" id="p6">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<canvas id="wo" width="420" height="100" style="border:1px solid var(--b)"></canvas>
<canvas id="wr" width="420" height="100" style="border:1px solid var(--b)"></canvas>
</div>
<div style="display:flex;gap:10px;margin-top:12px">
<button class="btn" id="br" onclick="play('r')" disabled>🔊 Ricostruzione</button>
<button class="btn btn2" onclick="dl('r','reconstructed.wav')">⬇️ WAV</button>
<button class="btn btn2" onclick="dl('o','original.wav')">⬇️ Originale</button>
</div>
<div style="margin-top:12px;padding:10px;border-radius:8px;background:#1a1a1a;border:1px solid var(--b);font-size:12px;color:#aaa" id="met">...</div>
</div>
</div>

<script>
let C=null,O=null,R=null,D=null,Sr=44100,DS=[],SS={},TR={},SA={},SC={};
const PL=["#ef4444","#f97316","#eab308","#22c55e","#3b82f6","#8b5cf6","#ec4899","#06b6d4","#14b8a6","#f59e0b"];
function hd(e){e.preventDefault();e.target.style.borderColor='var(--b)';if(e.dataTransfer.files.length)hf(e.dataTransfer.files[0])}
function hf(file){
document.getElementById('fi').style.display='block';document.getElementById('fi').textContent='📄 '+file.name;
if(!C)C=new(window.AudioContext||webkitAudioContext)();
file.arrayBuffer().then(ab=>C.decodeAudioData(ab)).then(dec=>{
Sr=dec.sampleRate;const c0=dec.getChannelData(0);
D=new Float32Array(c0.length);
if(dec.numberOfChannels>1){const c1=dec.getChannelData(1);for(let i=0;i<c0.length;i++)D[i]=(c0[i]+c1[i])*0.5}
else D.set(c0);O=D;document.getElementById('ba').disabled=false;document.getElementById('bp').disabled=false;
log('Caricato: '+D.length+' campioni @ '+Sr+'Hz','g');
}).catch(e=>log('Errore: '+e.message,'r'));
}
async function run(){try{
document.getElementById('pg').style.display='block';document.getElementById('rs').style.display='none';
document.getElementById('ba').disabled=true;document.getElementById('lg').innerHTML='';
const t0=performance.now(),maxK=+document.getElementById('mk').value,osig=+document.getElementById('os').value/10,mnd=+document.getElementById('md').value;

sp('FASE 1: Spettrogramma FFT',8);const {spec,freqs}=specgram(D,Sr);log('FFT 2048: '+spec.length+' frame','i');await sl(200);
sp('FASE 2: Rilevamento K sorgenti',20);const nk=autoK(spec,maxK);log('Rilevati '+nk+' strumenti','g');await sl(300);
sp('FASE 3: Separazione Wiener',38);SS=wiener(spec,nk,D);log('Separati '+Object.keys(SS).length,'i');await sl(400);
sp('FASE 4: Feature + Classificazione',50);classify();await sl(200);
sp('FASE 5: YIN + Spectral Flux',65);TR={};let tn=0;
for(const[id,src]of Object.entries(SS)){const si=DS.find(s=>s.id===id);const n=transcribe(src,Sr,si,osig,mnd);TR[id]=n;tn+=n.length}
log('Note: '+tn,'g');await sl(400);
sp('FASE 6: Estrazione campioni',78);SA={};
for(const[id,src]of Object.entries(SS)){const si=DS.find(s=>s.id===id);const s=extract(src,Sr,si);if(s)SA[id]=s}
log('Campioni: '+Object.keys(SA).length,'i');await sl(300);
sp('FASE 7a: Ricostruzione ADSR',88);const t7=performance.now();R=recon(TR,SA,D.length,Sr);log('Ricostruzione: '+((performance.now()-t7)/1000).toFixed(1)+'s','i');await sl(50);
sp('FASE 7b: Metriche SI-SDR / MSE / correlazione',92);const tm=performance.now();const sdr=siSdr(O,R),mseV=mse(O,R),cor=corr(O,R);log('Metriche: '+((performance.now()-tm)/1000).toFixed(1)+'s','i');await sl(100);
sp('FASE 7c: Grafici e pannelli',95);
sp('Completato!',100);
const el=((performance.now()-t0)/1000).toFixed(1);
log('SI-SDR: '+sdr.toFixed(1)+'dB | '+el+'s',sdr>3?'g':'w');
show(nk,tn,sdr,mseV,cor,el);
document.getElementById('ba').disabled=false;
}catch(e){log('⛔ ERRORE: '+((e&&e.message)?e.message:e),'r');sp('ERRORE: '+((e&&e.message)?e.message:e),100);document.getElementById('ba').disabled=false;}}

function specgram(data,sr){
const N=2048,h=512,fr=Math.floor((data.length-N)/h),nb=N/2,spec=[];
for(let f=0;f<fr;f++){const frame=new Float32Array(N);const st=f*h;for(let i=0;i<N;i++)frame[i]=(data[st+i]||0)*(0.5-0.5*Math.cos(2*Math.PI*i/(N-1)));spec.push(fftMag(frame).slice(0,nb))}
const freqs=[];for(let k=0;k<nb;k++)freqs.push(k*sr/N);return{spec,freqs};
}
function fftMag(input){
const N=input.length,re=new Float32Array(N),im=new Float32Array(N);for(let i=0;i<N;i++)re[i]=input[i];
for(let len=2;len<=N;len<<=1){const half=len>>1;for(let i=0;i<N;i+=len){for(let j=0;j<half;j++){const a=-2*Math.PI*j/len;const c=Math.cos(a),s=Math.sin(a);const uR=re[i+j],uI=im[i+j];const vR=re[i+j+half]*c-im[i+j+half]*s;const vI=re[i+j+half]*s+im[i+j+half]*c;re[i+j]=uR+vR;im[i+j]=uI+vI;re[i+j+half]=uR-vR;im[i+j+half]=uI-vI}}}
const mag=new Float32Array(N/2);for(let k=0;k<N/2;k++)mag[k]=Math.sqrt(re[k]*re[k]+im[k]*im[k]);return mag;
}

function autoK(spec,maxK){
const nf=spec.length,nb=spec[0].length;
const feat=spec.map(f=>{const b=[];for(let i=0;i<16;i++){const s=Math.floor(nb*i/16),e=Math.floor(nb*(i+1)/16);let sum=0;for(let k=s;k<e;k++)sum+=f[k];b.push(sum/Math.max(1,e-s))}return b});
let bestK=2,bestSc=-Infinity;
for(let k=2;k<=Math.min(maxK,Math.floor(feat.length/8));k++){
const{labels,centroids}=kmeans(feat,k,30);const sc=silhouette(feat,labels,centroids,k);
log(' K='+k+' → sc='+sc.toFixed(3),'i');if(sc>bestSc){bestSc=sc;bestK=k}}
return bestK;
}
function kmeans(data,k,it){
const n=data.length,dim=data[0].length,cent=[];const used=new Set();
while(cent.length<k){const idx=Math.floor(Math.random()*n);if(!used.has(idx)){used.add(idx);cent.push([...data[idx]])}}
let lab=new Int32Array(n);
for(let iter=0;iter<it;iter++){
let chg=false;
for(let i=0;i<n;i++){let best=0,bd=Infinity;for(let c=0;c<k;c++){let d=0;for(let j=0;j<dim;j++)d+=(data[i][j]-cent[c][j])**2;if(d<bd){bd=d;best=c}}if(lab[i]!==best)chg=true;lab[i]=best}
if(!chg)break;
for(let c=0;c<k;c++){const sum=new Float32Array(dim);let cnt=0;for(let i=0;i<n;i++)if(lab[i]===c){for(let j=0;j<dim;j++)sum[j]+=data[i][j];cnt++}if(cnt>0)for(let j=0;j<dim;j++)cent[c][j]=sum[j]/cnt}}
return{labels:lab,centroids:cent};
}
function silhouette(data,labels,centroids,k){
const n=data.length,dim=data[0].length;let tot=0,cnt=0;
for(let i=0;i<n;i++){const ci=labels[i];let a=0,ac=0,b=Infinity;
for(let j=0;j<n;j++){if(i===j)continue;let d=0;for(let d2=0;d2<dim;d2++)d+=(data[i][d2]-data[j][d2])**2;d=Math.sqrt(d);if(labels[j]===ci){a+=d;ac++}}
for(let c=0;c<k;c++){if(c===ci)continue;let d=0;for(let j=0;j<dim;j++)d+=(data[i][j]-centroids[c][j])**2;b=Math.min(b,Math.sqrt(d))}
if(ac>0){a/=ac;tot+=(b-a)/Math.max(a,b);cnt++}}
return cnt>0?tot/cnt:0;
}

function wiener(spec,k,data){
const nf=spec.length,nb=spec[0].length;
const feat=spec.map(f=>{const b=[];for(let i=0;i<16;i++){const s=Math.floor(nb*i/16),e=Math.floor(nb*(i+1)/16);let sum=0;for(let k2=s;k2<e;k2++)sum+=f[k2];b.push(sum/Math.max(1,e-s))}return b});
const{labels,centroids}=kmeans(feat,k,40);
const cp=[];for(let c=0;c<k;c++){const p=new Float32Array(nb);let cnt=0;for(let f=0;f<nf;f++)if(labels[f]===c){for(let b=0;b<nb;b++)p[b]+=spec[f][b]*spec[f][b];cnt++}if(cnt>0)for(let b=0;b<nb;b++)p[b]/=cnt;cp.push(p)}
const masks=[];for(let f=0;f<nf;f++){const m=new Float32Array(k);let tot=0;for(let c=0;c<k;c++){let sim=0;for(let b=0;b<nb;b++)sim+=spec[f][b]*cp[c][b];m[c]=sim;tot+=sim}if(tot>0)for(let c=0;c<k;c++)m[c]/=tot;masks.push(m)}
const N=2048,h=512,srcs={};DS=[];
for(let c=0;c<k;c++){srcs['s'+c]=new Float32Array(data.length);SC['s'+c]=PL[c%PL.length]}
for(let f=0;f<nf;f++){const st=f*h;for(let c=0;c<k;c++){const w=masks[f][c];if(w<0.05)continue;for(let i=0;i<N&&st+i<data.length;i++){const win=0.5-0.5*Math.cos(2*Math.PI*i/(N-1));srcs['s'+c][st+i]+=data[st+i]*w*win*win}}}
const res={};for(let c=0;c<k;c++){const id='s'+c;const e=srcs[id].reduce((a,b)=>a+b*b,0);if(e>1e-8){res[id]=srcs[id];DS.push({id,energy:Math.sqrt(e/srcs[id].length),rawEnergy:e})}}
DS.sort((a,b)=>b.energy-a.energy);return res;
}

function classify(){
const te=DS.reduce((a,s)=>a+s.rawEnergy,0);
for(const s of DS){
const src=SS[s.id];const f=features(src,Sr);s.features=f;s.energyPct=(s.rawEnergy/te*100).toFixed(1);
if(f.centroid<200)s.name='Sub Bass';else if(f.centroid<400)s.name='Bass';else if(f.zcr>0.15&&f.centroid>3000)s.name='Hi-Hat';else if(f.zcr>0.08&&f.centroid>1500)s.name='Snare';else if(f.centroid<800&&f.zcr<0.05)s.name='Kick';else if(f.centroid>2500&&f.rolloff>6000)s.name='Synth/FX';else if(f.centroid>1500&&f.contrast>0.5)s.name='Brass';else if(f.centroid>800&&f.contrast<0.3)s.name='Pad/Strings';else if(f.centroid>500&&f.centroid<2000)s.name='Piano/Guitar';else s.name='Tonal';
s.type=f.centroid<500?'drums':(f.zcr>0.1?'perc':'tonal');
}
}
function features(data,sr){
const N=2048,h=512;let sc=0,sr2=0,sz=0,sct=0,cnt=0;
const freqs=[];for(let k=0;k<N/2;k++)freqs.push(k*sr/N);
for(let f=0;f<Math.floor((data.length-N)/h);f++){
const frame=data.slice(f*h,f*h+N);const mag=fftMag(frame);const tot=mag.reduce((a,b)=>a+b,0);if(tot<1)continue;
let c=0;for(let k=0;k<mag.length;k++)c+=freqs[k]*mag[k];c/=tot;
let r=0,cum=0;for(let k=0;k<mag.length;k++){cum+=mag[k];if(cum>tot*0.85){r=freqs[k];break}}
let z=0;for(let i=1;i<N;i++)if((frame[i]>=0)!==(frame[i-1]>=0))z++;z/=N;
let ct=0;for(let b=0;b<4;b++){const s=Math.floor(mag.length*b/4),e=Math.floor(mag.length*(b+1)/4);let p=0,v=Infinity;for(let k=s;k<e;k++){p=Math.max(p,mag[k]);v=Math.min(v,mag[k])}ct+=Math.log(p/(v+1e-10)+1)}ct/=4;
sc+=c;sr2+=r;sz+=z;sct+=ct;cnt++;
}
return{centroid:cnt?sc/cnt:0,rolloff:cnt?sr2/cnt:0,zcr:cnt?sz/cnt:0,contrast:cnt?sct/cnt:0};
}

function transcribe(data,sr,si,osig,mnd){
const type=si.type,notes=[];
if(type==='drums'||type==='perc'){
const h=512,N=1024,flux=[];
for(let f=1;f<Math.floor((data.length-N)/h);f++){let s=0;for(let i=0;i<N;i++){const d=Math.abs(data[f*h+i])-Math.abs(data[(f-1)*h+i]);if(d>0)s+=d}flux.push(s)}
const m=flux.reduce((a,b)=>a+b,0)/flux.length;const sd=Math.sqrt(flux.reduce((a,b)=>a+(b-m)**2,0)/flux.length);const th=m+osig*sd;
for(let i=0;i<flux.length;i++)if(flux[i]>th&&(i===0||flux[i]>flux[i-1])&&(i===flux.length-1||flux[i]>flux[i+1])){
const t=i*h/sr;const p=si.name.includes('Hi')?42:si.name.includes('Kick')?36:38;
notes.push({pitch:p,start:t,end:t+0.08,velocity:Math.min(127,Math.floor(50+(flux[i]-th)/sd*40))})}
}else{
const h=1024,N=2048;const mns=mnd/1000;let cn=null;
for(let f=0;f<Math.floor((data.length-N)/h);f++){
const frame=data.slice(f*h,f*h+N);const rms=Math.sqrt(frame.reduce((a,b)=>a+b*b,0)/N);if(rms<0.005){if(cn&&f*h/sr-cn.start>mns){cn.end=f*h/sr;notes.push(cn)}cn=null;continue}
const p=yin(frame,sr);const midi=p>0?Math.round(69+12*Math.log2(p/440)):0;const t=f*h/sr;
if(midi>=20&&midi<=120){if(cn&&Math.abs(cn.pitch-midi)<=1&&t-cn.start<2){cn.end=t+0.1;cn.velocity=Math.max(cn.velocity,Math.min(127,Math.floor(rms*400)))}else{if(cn&&t-cn.start>mns)notes.push(cn);cn={pitch:midi,start:t,end:t+0.1,velocity:Math.min(127,Math.floor(rms*400))}}}
else{if(cn&&t-cn.start>mns)notes.push(cn);cn=null}
}if(cn&&cn.end-cn.start>mns)notes.push(cn)
}return notes;
}
function yin(frame,sr){
const N=frame.length,diff=new Float32Array(N);
for(let tau=0;tau<N;tau++){let s=0;for(let j=0;j<N-tau;j++)s+=(frame[j]-frame[j+tau])**2;diff[tau]=s}
const cmndf=new Float32Array(N);cmndf[0]=1;let run=0;
for(let tau=1;tau<N;tau++){run+=diff[tau];cmndf[tau]=diff[tau]*tau/(run+1e-10)}
const minLag=Math.floor(sr/4000),maxLag=Math.min(N/2,Math.floor(sr/40));
let bt=0,bv=Infinity;
for(let tau=minLag;tau<maxLag;tau++)if(cmndf[tau]<0.1&&cmndf[tau]<bv){bv=cmndf[tau];bt=tau+0.5*(cmndf[tau-1]-cmndf[tau+1])/(cmndf[tau-1]-2*cmndf[tau]+cmndf[tau+1]+1e-10)}
return bt>0?sr/bt:0;
}

function extract(data,sr,si){
const tl=Math.min(Math.floor(sr*1.2),data.length);
if(si.type==='tonal'){
const h=1024,N=2048;const pitches=[];
for(let f=0;f<Math.floor((data.length-N)/h);f++){const p=yin(data.slice(f*h,f*h+N),sr);pitches.push({idx:f*h,pitch:p,midi:p>0?Math.round(69+12*Math.log2(p/440)):0})}
let bs=0,bl=0,bm=0,cs=0,cm=0;
for(let i=0;i<pitches.length;i++){if(pitches[i].midi===0){cs=i+1;continue}if(cm===0||Math.abs(pitches[i].midi-cm)>1){if(i-cs>bl){bl=i-cs;bs=pitches[cs].idx;bm=cm}cs=i;cm=pitches[i].midi}}
if(bl<3){let mr=0,mi=0;for(let i=0;i<data.length-tl;i+=Math.floor(sr*0.1)){let r=0;for(let j=0;j<tl;j++)r+=data[i+j]**2;r=Math.sqrt(r/tl);if(r>mr){mr=r;mi=i}}bs=mi}
return proc(data.slice(bs,bs+tl),sr);
}else{let mr=0,mi=0;for(let i=0;i<data.length-tl;i+=Math.floor(sr*0.05)){let r=0;for(let j=0;j<tl;j++)r+=data[i+j]**2;r=Math.sqrt(r/tl);if(r>mr){mr=r;mi=i}}return proc(data.slice(mi,mi+tl),sr)}
}
function proc(s,sr){
const f=new Float32Array(s.length);
for(let i=0;i<s.length;i++){let e=1;const fi=Math.floor(sr*0.01),fo=Math.floor(sr*0.05);if(i<fi)e=i/fi;if(i>s.length-fo)e=Math.min(e,(s.length-i)/fo);f[i]=s[i]*e}
let p=0;for(let i=0;i<f.length;i++){const av=Math.abs(f[i]);if(av>p)p=av;}if(p>0)for(let i=0;i<f.length;i++)f[i]/=p*1.2;return f;
}

function recon(trans,samples,targetLen,sr){
const recon=new Float32Array(targetLen);
for(const[id,notes]of Object.entries(trans)){const sample=samples[id];if(!sample||!notes)continue;
for(const note of notes){const st=Math.floor(note.start*sr);const ratio=Math.pow(2,(note.pitch-72)/12);const sl=Math.floor(sample.length/ratio);const nd=Math.floor((note.end-note.start)*sr);const al=Math.min(sl,nd);
for(let i=0;i<al&&st+i<targetLen;i++){const si=Math.floor(i*ratio);if(si<sample.length){let e=1;const a=Math.min(al*0.05,sr*0.01),rl=Math.min(al*0.2,sr*0.05);if(i<a)e=i/a;if(i>al-rl)e*=Math.min(e,(al-i)/rl);recon[st+i]+=sample[si]*(note.velocity/127)*e*0.6}}}}
let p=0;for(let i=0;i<recon.length;i++){const av=Math.abs(recon[i]);if(av>p)p=av;}if(p>0)for(let i=0;i<recon.length;i++)recon[i]/=p*1.1;return recon;
}

function siSdr(ref,est){const n=Math.min(ref.length,est.length);let rM=0,eM=0;for(let i=0;i<n;i++){rM+=ref[i];eM+=est[i]}rM/=n;eM/=n;let num=0,rR=0;for(let i=0;i<n;i++){const r=ref[i]-rM,e=est[i]-eM;num+=r*e;rR+=r*r}const a=num/(rR+1e-10);let p2=0,no=0;for(let i=0;i<n;i++){const r=ref[i]-rM,e=est[i]-eM;const p=a*r;p2+=p*p;no+=(e-p)*(e-p)}return 10*Math.log10(p2/(no+1e-10))}
function mse(ref,est){let s=0;for(let i=0;i<Math.min(ref.length,est.length);i++)s+=(ref[i]-est[i])**2;return s/Math.min(ref.length,est.length)}
function corr(ref,est){const n=Math.min(ref.length,est.length);let rM=0,eM=0;for(let i=0;i<n;i++){rM+=ref[i];eM+=est[i]}rM/=n;eM/=n;let num=0,d1=0,d2=0;for(let i=0;i<n;i++){const a=ref[i]-rM,b=est[i]-eM;num+=a*b;d1+=a*a;d2+=b*b}return num/(Math.sqrt(d1)*Math.sqrt(d2)+1e-10)}

// UI
function sp(n,p){document.getElementById('pn').textContent=n;document.getElementById('pp').textContent=p+'%';document.getElementById('pf').style.width=p+'%';log(n,'p')}
function log(m,t){const d=document.createElement('div');d.className='log';d.style.color=t==='g'?'var(--g)':t==='r'?'var(--r)':t==='w'?'var(--w)':t==='p'?'var(--a)':'#888';d.textContent='['+new Date().toLocaleTimeString('it-IT',{hour12:false})+'] '+m;const c=document.getElementById('lg');c.appendChild(d);c.scrollTop=c.scrollHeight}
function sl(ms){return new Promise(r=>setTimeout(r,ms))}

function show(nk,tn,sdr,msev,cor,el){
document.getElementById('rs').style.display='block';
document.getElementById('m0').textContent=nk;document.getElementById('m1').textContent=tn;
document.getElementById('m2').textContent=sdr.toFixed(1);document.getElementById('m3').textContent=el;
document.getElementById('met').innerHTML='SI-SDR: <strong>'+sdr.toFixed(2)+' dB</strong> | MSE: '+msev.toExponential(2)+' | Corr: '+(cor*100).toFixed(1)+'% | Note/min: '+Math.round(tn/(D.length/Sr)*60);

// Energy chart
const ec=document.getElementById('ec');ec.innerHTML='<div style="font-size:13px;font-weight:600;margin-bottom:8px">Distribuzione Energia</div>';
DS.forEach((s,i)=>{const row=document.createElement('div');row.className='energy';row.innerHTML='<div style="width:8px;height:8px;border-radius:50%;background:'+SC[s.id]+'"></div><div>'+s.name+'</div><div><div style="width:0%;background:'+SC[s.id]+';height:6px;transition:.5s"></div></div><div>'+s.energyPct+'%</div>';ec.appendChild(row);setTimeout(()=>row.children[2].children[0].style.width=s.energyPct+'%',50+i*80)});

// Instruments detail
const il=document.getElementById('il');il.innerHTML='';
DS.forEach((s,i)=>{const notes=TR[s.id]||[];const d=document.createElement('div');d.className='inst';d.innerHTML='<div><div class="dot" style="background:'+SC[s.id]+'"></div><div><div style="font-size:14px;font-weight:600">'+(i+1)+'. '+s.name+'</div><div style="font-size:11px;color:#888">Centroid '+Math.round(s.features.centroid)+'Hz | ZCR '+s.features.zcr.toFixed(3)+' | Note '+notes.length+'</div></div></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn2" style="padding:4px 10px;font-size:11px" onclick="psMidi(\''+s.id+'\')">🎹 MIDI con lo strumento</button><button class="btn btn2" style="padding:4px 10px;font-size:11px" onclick="ps(\''+s.id+'\')">▶️ Campione</button><button class="btn btn2" style="padding:4px 10px;font-size:11px" onclick="ps2(\''+s.id+'\')">▶️ Separato</button></div>';il.appendChild(d)});

// Spectrograms
const tds=performance.now();drawSpec('so',O,Sr);drawSpec('sr',R,Sr);log('Spettrogrammi: '+((performance.now()-tds)/1000).toFixed(1)+'s','i');

// Piano roll
renderPR();

// MIDI
const md=document.getElementById('md');md.innerHTML='<div style="font-size:13px;font-weight:600;margin-bottom:10px">File MIDI</div>';
DS.forEach(s=>{const notes=TR[s.id];if(!notes||!notes.length)return;const data=writeMidi(s.name.replace(/\s+/g,'_'),notes);const blob=new Blob([data],{type:'audio/midi'});const url=URL.createObjectURL(blob);const row=document.createElement('div');row.className='row';row.innerHTML='<span style="font-size:13px">'+s.name+'.mid</span><a href="'+url+'" download="'+s.name+'.mid">⬇️ Scarica</a>';md.appendChild(row)});
const allN=[];DS.forEach(s=>(TR[s.id]||[]).forEach(n=>allN.push({...n,track:s.id,color:SC[s.id]})));
if(allN.length){const mb=new Blob([writeMultiMidi(DS,TR)],{type:'audio/midi'});const mu=URL.createObjectURL(mb);const mr=document.createElement('div');mr.className='row';mr.style.background='#1a1a1a';mr.innerHTML='<span style="font-size:13px;font-weight:600">final_multi_track.mid</span><a href="'+mu+'" download="final_multi_track.mid">⬇️ Scarica</a>';md.appendChild(mr)}

// Samples
const sd=document.getElementById('sd');sd.innerHTML='<div style="font-size:13px;font-weight:600;margin-bottom:10px">Campioni One-Shot</div>';
DS.forEach(s=>{const sample=SA[s.id];if(!sample)return;const wav=writeWav(sample,Sr);const blob=new Blob([wav],{type:'audio/wav'});const url=URL.createObjectURL(blob);const row=document.createElement('div');row.className='row';row.innerHTML='<span style="font-size:13px">sample_'+s.name.replace(/\s+/g,'_')+'.wav</span><a href="'+url+'" download="sample_'+s.name+'.wav">⬇️ Scarica</a>';sd.appendChild(row)});

// Waveforms

}

function renderPR(){
const container=document.getElementById('pr');const dur=D.length/Sr;
const allN=[];DS.forEach(s=>(TR[s.id]||[]).forEach(n=>allN.push({...n,track:s.id,color:SC[s.id]})));
if(!allN.length){container.innerHTML='<div style="color:#888;font-size:12px">Nessuna nota</div>';return}
let minP=999,maxP=-1;allN.forEach(n=>{if(n.pitch<minP)minP=n.pitch;if(n.pitch>maxP)maxP=n.pitch});minP-=2;maxP+=2;const pr=maxP-minP;
const h=220,w=860,nh=h/pr;
const wrap=document.createElement('div');wrap.className='piano';wrap.style.width=w+'px';wrap.style.height=h+'px';
for(let p=minP;p<=maxP;p++){const line=document.createElement('div');line.style.cssText='position:absolute;left:0;right:0;height:1px;background:'+([1,3,6,8,10].includes(p%12)?'#333':'#1a1a1a')+';top:'+((maxP-p)*nh)+'px;';wrap.appendChild(line)}
allN.forEach(n=>{const el=document.createElement('div');el.className='note';el.style.cssText='left:'+(n.start/dur*100)+'%;width:'+((n.end-n.start)/dur*100)+'%;height:'+(nh-1)+'px;top:'+((maxP-n.pitch)*nh)+'px;background:'+n.color+';';el.title=n.name+' | '+n.pitch+' | v'+n.velocity;wrap.appendChild(el)});
container.innerHTML='';container.appendChild(wrap);
}

function drawSpec(cid,data,sr){
const c=document.getElementById(cid),x=c.getContext('2d'),w=c.width,h=c.height;
x.fillStyle='#0a0a0a';x.fillRect(0,0,w,h);if(!data||!data.length)return;
const N=512,hp=256,nf=Math.floor((data.length-N)/hp),bw=Math.max(1,w/nf);
for(let f=0;f<nf;f++){const st=f*hp;let real=new Float32Array(N);for(let i=0;i<N;i++)real[i]=(data[st+i]||0)*(0.5-0.5*Math.cos(2*Math.PI*i/(N-1)));
for(let k=0;k<128;k++){let re=0,im=0;for(let n=0;n<N;n++){const a=-2*Math.PI*k*n/N;re+=real[n]*Math.cos(a);im+=real[n]*Math.sin(a)}const db=20*Math.log10(Math.sqrt(re*re+im*im)/N+1e-10);const n2=Math.max(0,Math.min(1,(db+90)/90));const r=Math.floor(255*Math.max(0,Math.min(1,n2*2.5-1.2)));const g=Math.floor(255*Math.max(0,Math.min(1,1-Math.abs(n2-0.5)*2)));const b=Math.floor(255*Math.max(0,Math.min(1,1.5-n2*1.5)));x.fillStyle='rgb('+r+','+g+','+b+')';x.fillRect(f*bw,h-(k/128)*h-h/128,bw+0.5,h/128+0.5)}}
}
function drawWave(cid,data){
const c=document.getElementById(cid),x=c.getContext('2d'),w=c.width,h=c.height;
x.clearRect(0,0,w,h);x.strokeStyle='var(--fg)';x.lineWidth=1;x.beginPath();
const step=Math.floor(data.length/w);
for(let i=0;i<w;i++){const idx=i*step;let max=0;for(let j=0;j<step;j++)max=Math.max(max,Math.abs(data[idx+j]||0));const y=h/2+max*(h/2-2)*(i%2===0?1:-1);if(i===0)x.moveTo(i,y);else x.lineTo(i,y)}x.stroke();
}

function ps(id){if(!C)C=new(window.AudioContext||webkitAudioContext)();const s=SA[id];if(!s)return;const b=C.createBuffer(1,s.length,Sr);b.copyToChannel(s,0);const src=C.createBufferSource();src.buffer=b;src.connect(C.destination);src.start()}
function ps2(id){if(!C)C=new(window.AudioContext||webkitAudioContext)();const s=SS[id];if(!s)return;const b=C.createBuffer(1,s.length,Sr);b.copyToChannel(s,0);const src=C.createBufferSource();src.buffer=b;src.connect(C.destination);src.start()}
// 🎹 MIDI della sorgente applicato al SUO one-shot (timbro dello strumento rilevato)
function psMidi(id){const note=TR[id]||[];const campione=SA[id];if(!campione){log('Nessun campione per '+id,'w');return}const t={},s={};t[id]=note;s[id]=campione;const r=recon(t,s,D.length,Sr);if(!C)C=new(window.AudioContext||webkitAudioContext)();const b=C.createBuffer(1,r.length,Sr);b.copyToChannel(r,0);const src=C.createBufferSource();src.buffer=b;src.connect(C.destination);src.start()}
function play(which){if(!C)C=new(window.AudioContext||webkitAudioContext)();const buf=which==='o'?O:R;if(!buf)return;const b=C.createBuffer(1,buf.length,Sr);b.copyToChannel(buf,0);const s=C.createBufferSource();s.buffer=b;s.connect(C.destination);s.start()}
function dl(which,fn){const buf=which==='r'?R:O;if(!buf)return;const wav=writeWav(buf,Sr);const blob=new Blob([wav],{type:'audio/wav'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fn;a.click();URL.revokeObjectURL(url)}

// Writers
function writeMidi(name,notes){
const b=[];const pb=x=>b.push(x&0xFF);const ps=s=>{for(let i=0;i<s.length;i++)pb(s.charCodeAt(i))};const p16=v=>{pb(v>>8);pb(v&0xFF)};const p32=v=>{pb(v>>24);pb(v>>16);pb(v>>8);pb(v&0xFF)};const vl=v=>{v=Math.max(0,Math.round(v)||0);if(v===0){pb(0);return}const buf=[];let t=v;while(t>0){buf.unshift(t&0x7F);t>>=7}for(let i=0;i<buf.length-1;i++)buf[i]|=0x80;for(const x of buf)pb(x)};
ps('MThd');p32(6);p16(1);p16(2);p16(480);ps('MTrk');const t0=b.length;p32(0);vl(0);pb(0xFF);pb(0x51);pb(3);pb(7);pb(0xA1);pb(0x20);vl(0);pb(0xFF);pb(0x2F);pb(0);p32at(t0,b.length-t0-4);
ps('MTrk');const t1=b.length;p32(0);vl(0);pb(0xFF);pb(0x03);pb(name.length);ps(name);const sorted=notes.slice().sort((a,b)=>a.start-b.start);let lt=0;sorted.forEach(n=>{const ton=Math.floor(n.start*2*480),tof=Math.floor(n.end*2*480);vl(ton-lt);pb(0x90);pb(n.pitch);pb(n.velocity);vl(tof-ton);pb(0x80);pb(n.pitch);pb(0);lt=tof});vl(0);pb(0xFF);pb(0x2F);pb(0);p32at(t1,b.length-t1-4);return new Uint8Array(b);
function p32at(off,v){b[off]=(v>>24)&0xFF;b[off+1]=(v>>16)&0xFF;b[off+2]=(v>>8)&0xFF;b[off+3]=v&0xFF}
}
function writeMultiMidi(srcs,trans){
const b=[];const pb=x=>b.push(x&0xFF);const ps=s=>{for(let i=0;i<s.length;i++)pb(s.charCodeAt(i))};const p16=v=>{pb(v>>8);pb(v&0xFF)};const p32=v=>{pb(v>>24);pb(v>>16);pb(v>>8);pb(v&0xFF)};const vl=v=>{v=Math.max(0,Math.round(v)||0);if(v===0){pb(0);return}const buf=[];let t=v;while(t>0){buf.unshift(t&0x7F);t>>=7}for(let i=0;i<buf.length-1;i++)buf[i]|=0x80;for(const x of buf)pb(x)};const p32a=(off,v)=>{b[off]=(v>>24)&0xFF;b[off+1]=(v>>16)&0xFF;b[off+2]=(v>>8)&0xFF;b[off+3]=v&0xFF};
const nt=srcs.length+1;ps('MThd');p32(6);p16(1);p16(nt);p16(480);ps('MTrk');const t0=b.length;p32(0);vl(0);pb(0xFF);pb(0x51);pb(3);pb(7);pb(0xA1);pb(0x20);vl(0);pb(0xFF);pb(0x2F);pb(0);p32a(t0,b.length-t0-4);
srcs.forEach(s=>{const notes=trans[s.id]||[];ps('MTrk');const t=b.length;p32(0);vl(0);pb(0xFF);pb(0x03);pb(s.id.length);ps(s.id);const sorted=notes.slice().sort((a,b)=>a.start-b.start);let lt=0;sorted.forEach(n=>{const ton=Math.floor(n.start*2*480),tof=Math.floor(n.end*2*480);vl(ton-lt);pb(0x90);pb(n.pitch);pb(n.velocity);vl(tof-ton);pb(0x80);pb(n.pitch);pb(0);lt=tof});vl(0);pb(0xFF);pb(0x2F);pb(0);p32a(t,b.length-t-4)});return new Uint8Array(b);
}
function writeWav(data,sr){
const n=data.length,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};const w32=(o,x)=>v.setUint32(o,x,true);const w16=(o,x)=>v.setUint16(o,x,true);
ws(0,'RIFF');w32(4,36+n*2);ws(8,'WAVE');ws(12,'fmt ');w32(16,16);w16(20,1);w16(22,1);w32(24,sr);w32(28,sr*2);w16(32,2);w16(34,16);ws(36,'data');w32(40,n*2);
for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,data[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7FFF,true)}return new Uint8Array(buf);
}
</script>

<!-- ═══════════════════════════════════════════════════════════════════════════
     Aggiunta di MIDI Studio (SampleLab): salva nel server locale i .mid generati
     dal browser, così compaiono nella tab "File generati" e nel selettore di
     "Confronta MIDI". L'estrattore originale è rimasto identico: questa è solo
     un'aggiunta in coda (vedi midi_studio/README.md).
     ═══════════════════════════════════════════════════════════════════════════ -->
<script>
async function postMidiToStudio(name, bytes){
  try{
    const fd = new FormData();
    fd.append("file", new Blob([bytes], {type: "audio/midi"}), name);
    fd.append("name", name);
    const r = await fetch("/api/save-midi", {method: "POST", body: fd});
    const d = await r.json();
    return d.file || null;
  }catch(e){ return null; }
}
async function saveMidisToStudio(){
  if (typeof DS === "undefined" || typeof TR === "undefined" || !DS.length) return;
  const saved = [];
  for (const s of DS){
    const notes = TR[s.id];
    if (!notes || !notes.length) continue;
    const clean = s.name.replace(/\s+/g, "_");
    const f = await postMidiToStudio(clean + ".mid", writeMidi(clean, notes));
    if (f) saved.push(f.name);
  }
  if (DS.some(s => (TR[s.id] || []).length)){
    const f = await postMidiToStudio("final_multi_track.mid", writeMultiMidi(DS, TR));
    if (f) saved.push(f.name);
  }
  const box = document.getElementById("ms-saved");
  if (box) box.textContent = saved.length
    ? "✅ Salvati in MIDI Studio (" + saved.length + "): " + saved.join(", ")
    : "Nessun MIDI da salvare.";
  if (saved.length && window.parent !== window)
    window.parent.postMessage({type: "midi-studio-saved", files: saved}, "*");
}
// Errori non gestiti: invece di "bloccarsi" in silenzio, finiscono nel log
window.addEventListener('error', function(ev){
  try{ log('⛔ ' + (ev.message || 'errore JS'), 'r'); }catch(e){}
});
window.addEventListener('unhandledrejection', function(ev){
  try{ const r = ev.reason; log('⛔ ' + ((r && r.message) ? r.message : r), 'r'); }catch(e){}
});
(function hookShow(){
  const orig = window.show;
  window.show = function(){
    const out = orig.apply(this, arguments);
    const md = document.getElementById("md");
    if (md){
      let box = document.getElementById("ms-saved");
      if (!box){
        box = document.createElement("div");
        box.id = "ms-saved";
        box.style.cssText = "margin-top:10px;font-size:12px;color:#4ecdc4";
        md.appendChild(box);
      }
      box.textContent = "Salvataggio in MIDI Studio…";
    }
    setTimeout(saveMidisToStudio, 300);
    return out;
  };
})();
</script>
